name: "Rapport de bug"
description: "Signaler un dysfonctionnement de l'application"
title: "[BUG] "
labels: ["bug", "a-trier"]
body:
  - type: dropdown
    id: severite
    attributes:
      label: "Severite"
      options:
        - "Bloquant — le service est inutilisable"
        - "Majeur — une fonction importante echoue"
        - "Mineur — gene visuelle ou ergonomique"
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: "Module concerne"
      options:
        - Comptes utilisateurs
        - Informations
        - Diagnostic
        - Respiration
        - Activites de detente
        - Tracker d'emotions
        - Administration
        - Autre
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Description du probleme"
      placeholder: "Decrivez le bug de maniere precise..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "Etapes pour reproduire"
      placeholder: |
        1. Aller sur...
        2. Cliquer sur...
        3. Constater l'erreur...
    validations:
      required: true

  - type: textarea
    id: attendu
    attributes:
      label: "Comportement attendu"
    validations:
      required: true

  - type: textarea
    id: environnement
    attributes:
      label: "Environnement"
      placeholder: |
        - Navigateur : Chrome 124
        - OS : Windows 11
        - Version : v1.0
