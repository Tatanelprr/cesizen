[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000

; Pool dimensionné pour 500 MB RAM (Railway free tier)
pm = dynamic
pm.max_children = 3
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 500

php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on
